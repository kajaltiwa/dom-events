<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .main{
            height: 100vh;
            width: 100vw;
        }
        .center{
            width: 82%;
            margin: auto;
        }
        .center,h3,h5{
            background-color:  cadetblue;
            color: white;
            text-align: center;
            padding: 11px;
            margin-bottom: 11px;
        }
        .center input{
           width: 100%;
           padding: 7px;
           margin-bottom: 10px;
           padding: 10px;
           border: none;
           border-bottom: 4px solid rgb(58, 110, 145);
           border-radius: 10px;
        }
        input:focus{
           outline: none; 
        }
        .center button{
            background-color: cadetblue;
            border: none;
            color: white;
            width: 100%;
            padding: 10px;
            font-size: 1.1rem;
        }
    </style>

</head>
<body>
    <div class="main">
        <div class="center">
            <h3>KeyBoard Events</h3>
           <h5 id="hname">Full Name</h5>
            <h5 id="hemail">Email Address</h5>
            <h5 id="hphone">Phone Number</h5>
            <h5 id="hdesingnation">Designation</h5>
            <h5 id="hsalary">Salary</h5>
            <h5 id="hcity">City</h5>
            <h5 id="hstate">State</h5>
            <input type="text" name="name" id="name" placeholder="FullName" onkeydown="fun1(event)" onkeypress="fun3(event)">
            <input type="email" name="email" id="email" placeholder="Email Address" onkeydown="fun1(event)" onkeypress="fun3(event)">
            <input type="text" name="phone" id="phone" placeholder="Phone Number" onkeydown="fun1(event)" onkeypress="fun3(event)">
            <input type="text" name="designation" id="designation" placeholder="Designation" onkeydown="fun1(event)" onkeypress="fun2(event)" onkeyup="fun3(event)">
            <input type="number" name="salary" id="salary" placeholder="Salary" onkeydown="fun1(event)" onkeypress="fun2(event)" onkeyup="fun3(event)">
            <input type="text" name="city" id="city" placeholder="City Name" onkeydown="fun1(event)" onkeypress="fun2(event)" onkeyup="fun3(event)">
            <input type="text" name="state" id="state" placeholder="State Name" onkeydown="fun1(event)" onkeypress="fun2(event)" onkeyup="fun3(event)">
            <button onclick="submit()">Submit</button>
        </div>
    </div>

    <script>

        function fun1(event){
        //   console.log(event.target.id)
        //   console.log(event.target.name)
        let input = document.getElementById(event.target.id)
        input.style.backgroundColor = "dark pink"
        }

        function fun2(event){
        let input = document.getElementById(event.target.id)
        input.style.backgroundColor = "red"
            
        }

        function fun3(event){
            let input = document.getElementById(event.target.id)
            let heading = document.getElementById("h"+event.target.id)
            
            input.style.backgroundColor = "white"
            console.log(event.target.value)

            heading.innerHTML = `${input.placeholder} : ${input.value}`
        }

        function submit(){
            alert(`
                Name                 :   ${document.getElementById("name").value}
                Email                :   ${document.getElementById("email").value}
                Phone                :   ${document.getElementById("phone").value}
                Designation          :   ${document.getElementById("designation").value}
                Salary               :   ${document.getElementById("salary").value}
                City                 :   ${document.getElementById("city").value}
                State                :   ${document.getElementById("state").value}
            `)
            
        }

    </script>
</body>
</html>
